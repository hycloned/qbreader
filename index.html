<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QBReader Mobile</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2e3148;
      --accent:    #6c63ff;
      --accent-dk: #574fd6;
      --green:     #22c55e;
      --red:       #ef4444;
      --yellow:    #f59e0b;
      --text:      #e8eaf6;
      --muted:     #7c7f9a;
      --radius:    14px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 17px;
      line-height: 1.6;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Layout ── */
    #app {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 16px 32px;
      gap: 14px;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }
    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .5px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #score-display {
      font-size: 0.85rem;
      color: var(--muted);
      text-align: right;
    }
    #score-display span { color: var(--text); font-weight: 600; }

    /* ── Filters row (always visible) ── */
    #filters-row {
      display: flex;
      gap: 12px;
    }
    #filters-row .setting-group { flex: 1 1 0; }

    /* ── Gear button ── */
    #btn-settings {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      width: 36px; height: 36px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
      flex-shrink: 0;
    }
    #btn-settings:active, #btn-settings.open {
      background: var(--surface);
      color: var(--text);
      border-color: var(--accent);
    }

    /* ── Settings drawer ── */
    #settings-drawer {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height .3s ease, opacity .2s ease, padding .3s ease;
      padding: 0 16px;
    }
    #settings-drawer.open {
      max-height: 600px;
      opacity: 1;
      padding: 16px;
    }
    .drawer-section {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .drawer-section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .drawer-section-title {
      width: 100%;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 2px;
    }
    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1 1 140px;
    }
    .setting-group label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--muted);
      font-weight: 600;
    }
    .setting-group select,
    .setting-group input[type="text"],
    .setting-group input[type="password"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.88rem;
      appearance: none;
      width: 100%;
      outline: none;
    }
    .setting-group select:focus,
    .setting-group input:focus { border-color: var(--accent); }
    .setting-group input[type="range"] {
      background: none;
      border: none;
      padding: 4px 0;
      accent-color: var(--accent);
      cursor: pointer;
      width: 100%;
    }
    #speed-label { color: var(--text); font-size: 0.88rem; }

    /* ElevenLabs status pill */
    #el-status {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
      margin-top: 4px;
      display: inline-block;
    }
    #el-status.ok  { background: #14532d; color: var(--green); }
    #el-status.err { background: #450a0a; color: var(--red); }
    #el-status.off { background: var(--border); color: var(--muted); }

    /* ── Meta badges ── */
    #meta-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 24px;
    }
    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
    }
    .badge.cat  { color: #a78bfa; border-color: #a78bfa55; }
    .badge.diff { color: var(--yellow); border-color: #f59e0b55; }
    .badge.set  { color: var(--muted); }

    /* ── Question card ── */
    #question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      height: 260px;
      overflow-y: auto;
      flex-shrink: 0;
      position: relative;
      transition: border-color .25s;
      -webkit-overflow-scrolling: touch;
    }
    #question-card.reading { border-color: var(--accent); }
    #question-card.buzzed  { border-color: var(--yellow); }
    #question-card.correct { border-color: var(--green); }
    #question-card.wrong   { border-color: var(--red); }

    #question-text {
      font-size: 1rem;
      line-height: 1.75;
      color: var(--text);
      white-space: pre-wrap;
    }
    .spoken   { background: rgba(108,99,255,.35); border-radius: 3px; padding: 0 2px; }
    .unspoken { color: var(--muted); }

    /* ── Progress bar ── */
    #progress-bar-wrap {
      height: 3px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 12px;
    }
    #progress-bar {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width .15s linear;
    }

    /* ── Answer reveal ── */
    #answer-reveal {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 0.95rem;
    }
    #answer-reveal .label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 4px;
    }
    #answer-reveal .answer-text { font-weight: 700; font-size: 1.05rem; }
    #answer-reveal.correct .answer-text { color: var(--green); }
    #answer-reveal.wrong   .answer-text { color: var(--red); }

    /* ── Buzz section ── */
    #buzz-section { display: flex; flex-direction: column; gap: 10px; }

    #btn-buzz {
      width: 100%;
      padding: 20px;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background .15s, transform .08s;
      user-select: none;
      -webkit-user-select: none;
    }
    #btn-buzz:active { transform: scale(.97); background: var(--accent-dk); }
    #btn-buzz:disabled { background: var(--border); color: var(--muted); cursor: default; transform: none; }

    #answer-input-row { display: none; flex-direction: column; gap: 8px; }

    #mic-status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: #1a1200;
      border: 2px solid var(--yellow);
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--yellow);
    }
    #mic-status .mic-icon { font-size: 1.4rem; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.85); }
    }
    #mic-transcript { font-size: 0.9rem; color: var(--text); font-weight: 400; font-style: italic; min-height: 1.2em; }

    #fallback-row { display: none; gap: 8px; }
    #answer-input {
      flex: 1;
      background: var(--bg);
      border: 2px solid var(--yellow);
      color: var(--text);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 1rem;
      outline: none;
    }
    #answer-input:focus { border-color: var(--accent); }
    #btn-submit {
      padding: 12px 20px;
      background: var(--yellow);
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    #btn-cancel-mic {
      padding: 10px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
    }
    #btn-cancel-mic:active { background: var(--border); }

    #result-banner {
      display: none;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      text-align: center;
    }
    #result-banner.correct { background: #14532d; color: var(--green); }
    #result-banner.wrong   { background: #450a0a; color: var(--red); }
    #result-banner.prompt  { background: #431407; color: var(--yellow); }

    /* ── Action row ── */
    #action-row { display: flex; gap: 10px; }
    .action-btn {
      flex: 1;
      padding: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .action-btn:active { background: var(--accent); border-color: var(--accent); }
    .action-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .action-btn.primary:active { background: var(--accent-dk); }

    /* ── Empty state ── */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 40px 20px;
      color: var(--muted);
      text-align: center;
      height: 100%;
    }
    #empty-state .icon { font-size: 3rem; }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <header>
    <h1>⚡ QBReader</h1>
    <div class="header-right">
      <div id="score-display">
        <span id="score-correct">0</span>/<span id="score-total">0</span>
        &nbsp;·&nbsp;<span id="score-pct">—</span>
      </div>
      <button id="btn-settings" title="Settings">⚙️</button>
    </div>
  </header>

  <!-- Category & difficulty — always visible -->
  <div id="filters-row">
    <div class="setting-group">
      <label>Category</label>
      <select id="sel-category">
        <option value="">All Categories</option>
        <option value="Literature">Literature</option>
        <option value="History">History</option>
        <option value="Science">Science</option>
        <option value="Fine Arts">Fine Arts</option>
        <option value="Religion">Religion</option>
        <option value="Mythology">Mythology</option>
        <option value="Philosophy">Philosophy</option>
        <option value="Social Science">Social Science</option>
        <option value="Current Events">Current Events</option>
        <option value="Geography">Geography</option>
        <option value="Other Academic">Other Academic</option>
        <option value="Trash">Trash</option>
      </select>
    </div>
    <div class="setting-group">
      <label>Difficulty</label>
      <select id="sel-difficulty">
        <option value="">All Levels</option>
        <option value="1">1 — Middle School</option>
        <option value="2">2</option>
        <option value="3">3 — Easy HS</option>
        <option value="4">4</option>
        <option value="5">5 — Regular HS</option>
        <option value="6">6 — Hard HS</option>
        <option value="7">7 — Easy College</option>
        <option value="8">8 — Regular College</option>
        <option value="9">9 — Hard College</option>
        <option value="10">10 — Open</option>
      </select>
    </div>
  </div>

  <!-- Settings drawer (voice / speed / ElevenLabs) -->
  <div id="settings-drawer">

    <!-- Voice & speed -->
    <div class="drawer-section">
      <div class="drawer-section-title">Reader</div>
      <div class="setting-group">
        <label>Voice</label>
        <select id="sel-voice">
          <option value="">Loading…</option>
        </select>
      </div>
      <div class="setting-group">
        <label>Speed — <span id="speed-label">0.9×</span></label>
        <input type="range" id="speed-slider" min="0.5" max="2.0" step="0.05" value="0.9" />
      </div>
    </div>

    <!-- ElevenLabs -->
    <div class="drawer-section">
      <div class="drawer-section-title">ElevenLabs (optional — human-quality voice)</div>
      <div class="setting-group" style="flex:1 1 100%">
        <label>API Key</label>
        <input type="password" id="el-api-key" placeholder="sk_… paste your key here" autocomplete="off" />
        <span id="el-status" class="off">Not configured</span>
      </div>
      <div class="setting-group" style="flex:1 1 100%">
        <label>ElevenLabs Voice</label>
        <select id="sel-el-voice">
          <option value="">— enter API key first —</option>
        </select>
      </div>
    </div>

  </div>

  <!-- Meta strip -->
  <div id="meta-strip"></div>

  <!-- Question card -->
  <div id="question-card">
    <div id="empty-state">
      <div class="icon">📖</div>
      <p>Tap <strong>New Question</strong> to start</p>
    </div>
    <div id="question-text" class="hidden"></div>
    <div id="progress-bar-wrap" class="hidden">
      <div id="progress-bar"></div>
    </div>
    <div id="answer-reveal"></div>
  </div>

  <!-- Buzz / answer -->
  <div id="buzz-section">
    <button id="btn-buzz" disabled>BUZZ</button>
    <div id="answer-input-row">
      <div id="mic-status">
        <span class="mic-icon">🎙️</span>
        <div>
          <div>Listening… speak your answer</div>
          <div id="mic-transcript"></div>
        </div>
      </div>
      <button id="btn-cancel-mic">Cancel / type instead</button>
      <div id="fallback-row">
        <input id="answer-input" type="text" placeholder="Your answer…"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <button id="btn-submit">Submit</button>
      </div>
    </div>
    <div id="result-banner"></div>
  </div>

  <!-- Action buttons -->
  <div id="action-row">
    <button class="action-btn" id="btn-skip">Skip / Reveal</button>
    <button class="action-btn primary" id="btn-new">New Question</button>
  </div>

</div>
<script>
/* ═══════════════════════════════════════════════════════════════════
   Speech Recognition
═══════════════════════════════════════════════════════════════════ */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const hasMic = !!SpeechRecognition;
let recognition = null;
if (hasMic) {
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 3;
}

/* ═══════════════════════════════════════════════════════════════════
   State
═══════════════════════════════════════════════════════════════════ */
const state = {
  tossup: null,
  words: [],
  wordIdx: -1,
  phase: 'idle',       // idle | loading | reading | buzzed | done
  utterance: null,
  synth: window.speechSynthesis,
  score: { correct: 0, total: 0 },
  readingTimer: null,
  buzzWordIdx: 0,
  promptCount: 0,
  micActive: false,
  elAudio: null,       // current ElevenLabs Audio object
};

/* ═══════════════════════════════════════════════════════════════════
   DOM refs
═══════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const qCard         = $('question-card');
const qText         = $('question-text');
const emptyState    = $('empty-state');
const progressBar   = $('progress-bar');
const progressWrap  = $('progress-bar-wrap');
const answerReveal  = $('answer-reveal');
const metaStrip     = $('meta-strip');
const btnBuzz       = $('btn-buzz');
const btnSkip       = $('btn-skip');
const btnNew        = $('btn-new');
const answerRow     = $('answer-input-row');
const micStatus     = $('mic-status');
const micTranscript = $('mic-transcript');
const btnCancelMic  = $('btn-cancel-mic');
const fallbackRow   = $('fallback-row');
const answerInput   = $('answer-input');
const btnSubmit     = $('btn-submit');
const resultBanner  = $('result-banner');
const speedSlider   = $('speed-slider');
const speedLabel    = $('speed-label');
const scoreCorrect  = $('score-correct');
const scoreTotal    = $('score-total');
const scorePct      = $('score-pct');
const selCategory   = $('sel-category');
const selDiff       = $('sel-difficulty');
const btnSettings   = $('btn-settings');
const settingsDrawer= $('settings-drawer');
const elApiKeyInput = $('el-api-key');
const elStatus      = $('el-status');
const selElVoice    = $('sel-el-voice');

/* ═══════════════════════════════════════════════════════════════════
   Settings drawer toggle
═══════════════════════════════════════════════════════════════════ */
btnSettings.addEventListener('click', () => {
  const open = settingsDrawer.classList.toggle('open');
  btnSettings.classList.toggle('open', open);
});

/* ═══════════════════════════════════════════════════════════════════
   Helpers
═══════════════════════════════════════════════════════════════════ */
function setPhase(p) {
  state.phase = p;
  qCard.className = (p === 'idle' || p === 'loading') ? '' : p;
}

function updateScore(result) {
  state.score.total++;
  if (result === 'correct') state.score.correct++;
  scoreTotal.textContent   = state.score.total;
  scoreCorrect.textContent = state.score.correct;
  scorePct.textContent = state.score.total > 0
    ? Math.round((state.score.correct / state.score.total) * 100) + '%' : '—';
}

function difficultyLabel(d) {
  const m = {1:'MS',2:'Easy HS',3:'Easy HS',4:'HS',5:'Reg HS',6:'Hard HS',7:'Easy Coll',8:'Coll',9:'Hard Coll',10:'Open'};
  return m[d] ? `Diff ${d} · ${m[d]}` : `Diff ${d}`;
}

function cleanQuestion(text) { return text.replace(/\(\*\)\s*/g, '').trim(); }
function tokenize(text)       { return text.split(/(\s+)/).filter(Boolean); }

/* ═══════════════════════════════════════════════════════════════════
   Meta badges
═══════════════════════════════════════════════════════════════════ */
function renderMeta(t) {
  metaStrip.innerHTML = '';
  if (!t) return;
  [{ text: t.category, cls:'cat' }, { text: t.subcategory, cls:'cat' },
   { text: difficultyLabel(t.difficulty), cls:'diff' }, { text: t.set?.name, cls:'set' }]
  .filter(b => b.text).forEach(b => {
    const el = document.createElement('span');
    el.className = `badge ${b.cls}`;
    el.textContent = b.text;
    metaStrip.appendChild(el);
  });
}

/* ═══════════════════════════════════════════════════════════════════
   Question word rendering
═══════════════════════════════════════════════════════════════════ */
function renderQuestionWords(upTo) {
  qText.innerHTML = state.words.map((w, i) => {
    if (/^\s+$/.test(w)) return w;
    if (i < upTo)   return `<span class="word">${w}</span>`;
    if (i === upTo) return `<span class="word spoken">${w}</span>`;
    return `<span class="word unspoken">${w}</span>`;
  }).join('');
  const el = qText.querySelector('.spoken');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ═══════════════════════════════════════════════════════════════════
   Fetch tossup
═══════════════════════════════════════════════════════════════════ */
async function fetchTossup() {
  setPhase('loading');
  btnNew.disabled = true;
  btnNew.innerHTML = '<span class="spinner"></span>Loading…';
  btnBuzz.disabled = true;
  btnSkip.disabled = true;
  hideAll();

  const params = new URLSearchParams({ number: 1 });
  if (selCategory.value)  params.set('categories', selCategory.value);
  if (selDiff.value)      params.set('difficulties', selDiff.value);

  try {
    const res  = await fetch(`https://www.qbreader.org/api/random-tossup?${params}`);
    if (!res.ok) throw new Error();
    const data = await res.json();
    const tossup = data.tossups?.[0];
    if (!tossup) throw new Error();

    state.tossup      = tossup;
    state.promptCount = 0;
    state.words       = tokenize(cleanQuestion(tossup.question_sanitized));
    state.wordIdx     = -1;

    renderMeta(tossup);
    emptyState.classList.add('hidden');
    qText.classList.remove('hidden');
    progressWrap.classList.remove('hidden');
    progressBar.style.width = '0%';
    renderQuestionWords(-1);
    answerReveal.style.display = 'none';
    answerReveal.className = '';

    btnNew.disabled   = false;
    btnNew.textContent = 'New Question';
    btnSkip.disabled  = false;

    startReading();
  } catch {
    btnNew.disabled   = false;
    btnNew.textContent = 'New Question';
    btnSkip.disabled  = false;
    qText.innerHTML   = `<span style="color:var(--red)">Error loading. Check connection and try again.</span>`;
    qText.classList.remove('hidden');
    setPhase('idle');
  }
}

/* ═══════════════════════════════════════════════════════════════════
   Web Speech — voice selection
═══════════════════════════════════════════════════════════════════ */
const selVoice = $('sel-voice');
let wsVoices = [];
let chosenWsVoice = null;

function scoreVoice(v) {
  if (!v.lang.startsWith('en')) return -1;
  let s = 0;
  const n = v.name.toLowerCase();
  if (n.includes('premium'))  s += 100;
  if (n.includes('enhanced')) s += 90;
  if (n.includes('neural'))   s += 90;
  if (n.includes('wavenet'))  s += 90;
  if (n.includes('siri'))     s += 80;
  if (n.includes('samantha')) s += 70;
  if (n.includes('daniel'))   s += 65;
  if (n.includes('karen'))    s += 65;
  if (n.includes('moira'))    s += 60;
  if (n.includes('google'))   s += 55;
  if (n.includes('microsoft'))s += 50;
  if (n.includes('compact'))  s -= 30;
  if (v.lang === 'en-US')     s += 10;
  else if (v.lang === 'en-GB')s += 5;
  return s;
}

function populateVoices() {
  wsVoices = state.synth.getVoices().filter(v => v.lang.startsWith('en'));
  if (!wsVoices.length) return;
  wsVoices.sort((a, b) => scoreVoice(b) - scoreVoice(a));
  selVoice.innerHTML = '';
  // ElevenLabs placeholder at the top (only visible when key is set)
  const elOpt = document.createElement('option');
  elOpt.value = '__elevenlabs__';
  elOpt.id = 'opt-elevenlabs';
  elOpt.textContent = '⚡ ElevenLabs (see settings)';
  elOpt.classList.add('hidden');
  selVoice.appendChild(elOpt);
  wsVoices.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    const score = scoreVoice(v);
    const tier  = score >= 80 ? '★★★ ' : score >= 50 ? '★★ ' : score >= 20 ? '★ ' : '';
    opt.textContent = `${tier}${v.name} (${v.lang})`;
    selVoice.appendChild(opt);
  });
  chosenWsVoice = wsVoices[0];
  selVoice.value = '0';
}

state.synth.onvoiceschanged = populateVoices;
populateVoices();

selVoice.addEventListener('change', () => {
  if (selVoice.value === '__elevenlabs__') return; // handled by EL
  chosenWsVoice = wsVoices[parseInt(selVoice.value, 10)] || null;
});

/* ═══════════════════════════════════════════════════════════════════
   ElevenLabs integration
═══════════════════════════════════════════════════════════════════ */
// Persist key in localStorage so user doesn't retype every visit
const EL_KEY_STORE = 'el_api_key';
const EL_VOICE_STORE = 'el_voice_id';

let elApiKey  = localStorage.getItem(EL_KEY_STORE) || '';
let elVoiceId = localStorage.getItem(EL_VOICE_STORE) || '';

if (elApiKey) {
  elApiKeyInput.value = elApiKey;
  setElStatus('checking');
  loadElVoices();
}

elApiKeyInput.addEventListener('change', () => {
  elApiKey = elApiKeyInput.value.trim();
  localStorage.setItem(EL_KEY_STORE, elApiKey);
  if (elApiKey) { setElStatus('checking'); loadElVoices(); }
  else          { setElStatus('off'); resetElVoiceSelect(); }
});

function setElStatus(s, msg) {
  elStatus.className = s;
  elStatus.textContent =
    s === 'ok'       ? `✓ Connected — ${msg || ''}` :
    s === 'err'      ? `✗ ${msg || 'Invalid key'}` :
    s === 'checking' ? 'Checking…' : 'Not configured';
}

function resetElVoiceSelect() {
  selElVoice.innerHTML = '<option value="">— enter API key first —</option>';
  // Hide ElevenLabs option in voice picker
  const elOpt = document.getElementById('opt-elevenlabs');
  if (elOpt) elOpt.classList.add('hidden');
  if (selVoice.value === '__elevenlabs__') {
    selVoice.value = '0';
    chosenWsVoice = wsVoices[0] || null;
  }
}

async function loadElVoices() {
  try {
    const res = await fetch('https://api.elevenlabs.io/v1/voices', {
      headers: { 'xi-api-key': elApiKey }
    });
    if (!res.ok) throw new Error('bad key');
    const data = await res.json();
    const voices = data.voices || [];

    selElVoice.innerHTML = '';
    voices.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.voice_id;
      opt.textContent = `${v.name}${v.labels?.accent ? ' · ' + v.labels.accent : ''}`;
      selElVoice.appendChild(opt);
    });

    // Restore saved voice or default to first
    if (elVoiceId && voices.find(v => v.voice_id === elVoiceId)) {
      selElVoice.value = elVoiceId;
    } else if (voices.length) {
      elVoiceId = voices[0].voice_id;
      selElVoice.value = elVoiceId;
      localStorage.setItem(EL_VOICE_STORE, elVoiceId);
    }

    setElStatus('ok', voices.length + ' voices loaded');

    // Show ElevenLabs option in the main voice picker and auto-select it
    const elOpt = document.getElementById('opt-elevenlabs');
    if (elOpt) {
      elOpt.classList.remove('hidden');
      elOpt.textContent = `⚡ ElevenLabs — ${selElVoice.options[selElVoice.selectedIndex]?.textContent || ''}`;
    }
    selVoice.value = '__elevenlabs__';

  } catch {
    setElStatus('err', 'Check your API key');
    resetElVoiceSelect();
  }
}

selElVoice.addEventListener('change', () => {
  elVoiceId = selElVoice.value;
  localStorage.setItem(EL_VOICE_STORE, elVoiceId);
  // Update the label in main voice picker
  const elOpt = document.getElementById('opt-elevenlabs');
  if (elOpt) elOpt.textContent = `⚡ ElevenLabs — ${selElVoice.options[selElVoice.selectedIndex]?.textContent || ''}`;
});

function usingElevenLabs() {
  return selVoice.value === '__elevenlabs__' && elApiKey && elVoiceId;
}

/* ── ElevenLabs speak ── */
// Streams the full question text through ElevenLabs TTS.
// Word highlight is driven by a timer (EL doesn't give word events).
async function speakWithElevenLabs(text, onWordTick, onEnd, onError) {
  // Stop any previous audio
  if (state.elAudio) { state.elAudio.pause(); state.elAudio = null; }

  const rate = getRate();
  try {
    const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${elVoiceId}/stream`, {
      method: 'POST',
      headers: {
        'xi-api-key': elApiKey,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        text,
        model_id: 'eleven_turbo_v2',        // lowest latency model
        voice_settings: {
          stability: 0.45,                   // slight variation = more natural
          similarity_boost: 0.80,
          style: 0.20,
          use_speaker_boost: true,
        },
      }),
    });

    if (!res.ok) throw new Error('EL API error');

    const blob  = await res.blob();
    const url   = URL.createObjectURL(blob);
    const audio = new Audio(url);
    state.elAudio = audio;

    // Playback rate maps to our speed slider
    audio.playbackRate = Math.min(Math.max(rate, 0.5), 2.0);

    // Drive word highlight by timer since EL gives no word events
    const words      = text.split(/\s+/).filter(Boolean);
    const msPerWord  = (60 / (150 * rate)) * 1000;
    let   wordPos    = 0;
    const ticker = setInterval(() => {
      if (state.phase !== 'reading') { clearInterval(ticker); return; }
      if (wordPos < words.length) { onWordTick(wordPos); wordPos++; }
    }, msPerWord);

    audio.onended = () => {
      clearInterval(ticker);
      URL.revokeObjectURL(url);
      state.elAudio = null;
      onEnd();
    };
    audio.onerror = () => {
      clearInterval(ticker);
      URL.revokeObjectURL(url);
      state.elAudio = null;
      onError();
    };

    audio.play();
  } catch(e) {
    onError(e);
  }
}

function stopElAudio() {
  if (state.elAudio) { state.elAudio.pause(); state.elAudio = null; }
}

/* ═══════════════════════════════════════════════════════════════════
   TTS — Web Speech chunks
   Split only on sentence-ending punctuation. 25-word safety limit
   prevents iOS silent truncation.
═══════════════════════════════════════════════════════════════════ */
let ttsChunks = [];
let chunkIdx  = 0;

function buildChunks(words) {
  const chunks = [];
  let buf = [];
  const flush = () => {
    if (!buf.length) return;
    const last = buf[buf.length-1].word;
    chunks.push({ words:[...buf], startIdx:buf[0].idx, endIdx:buf[buf.length-1].idx, pause:pauseAfter(last) });
    buf = [];
  };
  for (let i = 0; i < words.length; i++) {
    const w = words[i];
    if (/^\s+$/.test(w)) continue;
    buf.push({ word:w, idx:i });
    if (/[.!?]$/.test(w) || buf.length >= 25) flush();
  }
  flush();
  return chunks;
}

function pauseAfter(w) {
  if (/[.!?]$/.test(w)) return 250;
  if (/[;:]$/.test(w))  return 140;
  if (/,$/.test(w))     return 80;
  return 40;
}

function getRate() { return parseFloat(speedSlider.value); }

function speakChunk(chunkI) {
  if (state.phase !== 'reading') return;
  if (chunkI >= ttsChunks.length) {
    setPhase('done'); btnBuzz.disabled = true; revealAnswer(null, 'done'); return;
  }
  const chunk = ttsChunks[chunkI];
  const rate  = getRate();
  const text  = chunk.words.map(w => w.word).join(' ');
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate  = rate;
  utter.pitch = 0.97;
  utter.lang  = 'en-US';
  if (chosenWsVoice) utter.voice = chosenWsVoice;

  state.utterance = utter;
  chunkIdx = chunkI;

  const msPerWord = (60 / (150 * rate)) * 1000;
  let localWordPos = 0;
  let boundaryFired = false;

  utter.onboundary = (e) => {
    if (e.name !== 'word' || state.phase !== 'reading') return;
    boundaryFired = true;
    let cc = 0;
    for (let wi = 0; wi < chunk.words.length; wi++) {
      cc += chunk.words[wi].word.length + (wi > 0 ? 1 : 0);
      if (cc >= e.charIndex + 1) { localWordPos = wi; break; }
    }
    const idx = chunk.words[localWordPos]?.idx ?? chunk.startIdx;
    state.wordIdx = idx; renderQuestionWords(idx); updateProgress(idx);
  };

  let timerWordPos = 0;
  const timerInterval = setInterval(() => {
    if (state.phase !== 'reading') { clearInterval(timerInterval); return; }
    if (!boundaryFired) {
      const idx = chunk.words[timerWordPos]?.idx ?? chunk.startIdx;
      state.wordIdx = idx; renderQuestionWords(idx); updateProgress(idx);
      timerWordPos = Math.min(timerWordPos + 1, chunk.words.length - 1);
    }
  }, msPerWord);

  utter.onend = () => {
    clearInterval(timerInterval);
    if (state.phase !== 'reading') return;
    state.wordIdx = chunk.endIdx;
    renderQuestionWords(chunk.endIdx); updateProgress(chunk.endIdx);
    setTimeout(() => speakChunk(chunkI + 1), chunk.pause);
  };
  utter.onerror = () => {
    clearInterval(timerInterval);
    if (state.phase === 'reading') speakChunk(chunkI + 1);
  };

  state.synth.speak(utter);
}

/* ── startReading — dispatches to ElevenLabs or Web Speech ── */
function startReading() {
  state.synth.cancel();
  stopElAudio();
  clearTimeout(state.readingTimer);

  setPhase('reading');
  btnBuzz.disabled = false;

  if (usingElevenLabs()) {
    // ElevenLabs: send full sanitized text, drive highlight by word timer
    const fullText = cleanQuestion(state.tossup.question_sanitized);
    const allWords = state.words.filter(w => !/^\s+$/.test(w)); // non-space tokens

    state.readingTimer = setTimeout(() => {
      speakWithElevenLabs(
        fullText,
        (wordPos) => {
          // wordPos = index into allWords (no whitespace)
          // map back to state.words index
          let count = -1;
          for (let i = 0; i < state.words.length; i++) {
            if (!/^\s+$/.test(state.words[i])) count++;
            if (count === wordPos) {
              state.wordIdx = i;
              renderQuestionWords(i);
              updateProgress(i);
              break;
            }
          }
        },
        () => {
          // onEnd
          if (state.phase !== 'reading') return;
          renderQuestionWords(state.words.length - 1);
          progressBar.style.width = '100%';
          setPhase('done'); btnBuzz.disabled = true; revealAnswer(null, 'done');
        },
        () => {
          // onError — fall back to Web Speech silently
          if (state.phase !== 'reading') return;
          ttsChunks = buildChunks(state.words); chunkIdx = 0;
          speakChunk(0);
        }
      );
    }, 300);
  } else {
    // Web Speech
    ttsChunks = buildChunks(state.words); chunkIdx = 0; state.wordIdx = -1;
    state.readingTimer = setTimeout(() => speakChunk(0), 350);
  }
}

function updateProgress(wordIdx) {
  let spoken = 0, total = 0;
  for (let i = 0; i < state.words.length; i++) {
    if (/^\s+$/.test(state.words[i])) continue;
    total++;
    if (i <= wordIdx) spoken++;
  }
  progressBar.style.width = total > 0 ? Math.min(100, Math.round((spoken/total)*100)) + '%' : '0%';
}

/* ═══════════════════════════════════════════════════════════════════
   Buzz
═══════════════════════════════════════════════════════════════════ */
function doBuzz() {
  if (state.phase !== 'reading') return;
  // Pause whichever engine is active
  if (usingElevenLabs()) {
    if (state.elAudio) state.elAudio.pause();
  } else {
    state.synth.pause();
  }
  state.buzzWordIdx = state.wordIdx;
  setPhase('buzzed');
  btnBuzz.disabled = true;
  answerRow.style.display = 'flex';
  if (hasMic) { showMicUI(); startMic(); }
  else        { showFallbackUI(); }
}

/* ═══════════════════════════════════════════════════════════════════
   Mic UI
═══════════════════════════════════════════════════════════════════ */
function showMicUI() {
  micStatus.style.display = 'flex';
  micTranscript.textContent = '';
  btnCancelMic.style.display = 'block';
  fallbackRow.style.display = 'none';
}
function showFallbackUI() {
  micStatus.style.display = 'none';
  btnCancelMic.style.display = 'none';
  fallbackRow.style.display = 'flex';
  answerInput.value = '';
  answerInput.focus();
}
function hideBuzzUI() {
  answerRow.style.display = 'none';
  micStatus.style.display = 'none';
  btnCancelMic.style.display = 'none';
  fallbackRow.style.display = 'none';
  micTranscript.textContent = '';
}

/* ═══════════════════════════════════════════════════════════════════
   Speech Recognition
═══════════════════════════════════════════════════════════════════ */
function startMic() {
  if (!recognition) return;
  state.micActive = true;
  micTranscript.textContent = '';

  recognition.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t; else interim += t;
    }
    micTranscript.textContent = final || interim;
    if (final.trim()) { stopMic(); submitAnswer(final.trim()); }
  };

  recognition.onerror = (e) => {
    state.micActive = false;
    if (e.error === 'no-speech') {
      micTranscript.textContent = 'No speech detected.';
      setTimeout(showFallbackUI, 800);
    } else if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      showFallbackUI();
      showPromptBanner('Mic access denied. Type your answer below.');
    } else {
      micTranscript.textContent = `Mic error: ${e.error}`;
      setTimeout(showFallbackUI, 1000);
    }
  };

  recognition.onend = () => {
    state.micActive = false;
    if (state.phase === 'buzzed' && answerRow.style.display !== 'none') {
      if (!micTranscript.textContent || micTranscript.textContent.startsWith('No speech'))
        showFallbackUI();
    }
  };

  try { recognition.start(); }
  catch { recognition.stop(); setTimeout(() => { try { recognition.start(); } catch { showFallbackUI(); } }, 300); }
}

function stopMic() {
  state.micActive = false;
  try { recognition?.stop(); } catch {}
}

btnCancelMic.addEventListener('click', () => { stopMic(); showFallbackUI(); });

/* ═══════════════════════════════════════════════════════════════════
   Answer checking
═══════════════════════════════════════════════════════════════════ */
async function submitAnswer(given) {
  given = (given || answerInput.value || '').trim();
  if (!given) return;

  hideBuzzUI();
  resultBanner.className = 'prompt';
  resultBanner.style.display = 'block';
  resultBanner.innerHTML = `<span class="spinner"></span> Checking: "<em>${given}</em>"`;

  try {
    const res  = await fetch('https://www.qbreader.org/api/check-answer?' +
      new URLSearchParams({ answerline: state.tossup.answer_sanitized, givenAnswer: given }));
    const data = await res.json();
    const dir  = data.directive;

    if (dir === 'accept') {
      handleResult('correct', given);
    } else if (dir === 'prompt') {
      state.promptCount++;
      if (state.promptCount >= 3) { handleResult('wrong', given); return; }
      resultBanner.className = 'prompt';
      resultBanner.style.display = 'block';
      resultBanner.textContent = `↩ PROMPT: ${data.promptString || 'Can you be more specific?'}`;
      answerRow.style.display = 'flex';
      if (hasMic) { showMicUI(); startMic(); } else showFallbackUI();
    } else {
      handleResult('wrong', given);
    }
  } catch {
    resultBanner.className = 'prompt';
    resultBanner.style.display = 'block';
    resultBanner.textContent = '⚠ Network error. Try again.';
    answerRow.style.display = 'flex';
    if (hasMic) { showMicUI(); startMic(); } else showFallbackUI();
  }
}

function showPromptBanner(msg) {
  resultBanner.className = 'prompt';
  resultBanner.style.display = 'block';
  resultBanner.textContent = msg;
}

function handleResult(result, given) {
  state.synth.cancel(); stopElAudio(); stopMic();
  setPhase('done'); hideBuzzUI(); btnBuzz.disabled = true;
  updateScore(result === 'correct' ? 'correct' : 'wrong');
  resultBanner.className = result;
  resultBanner.style.display = 'block';
  resultBanner.textContent = result === 'correct' ? `✓ CORRECT — "${given}"` : `✗ WRONG — you said: "${given}"`;
  revealAnswer(result, 'answered');
  renderQuestionWords(state.words.length - 1);
  progressBar.style.width = '100%';
}

/* ═══════════════════════════════════════════════════════════════════
   Reveal answer
═══════════════════════════════════════════════════════════════════ */
function revealAnswer(result, reason) {
  const t = state.tossup;
  if (!t) return;
  const clean = t.answer_sanitized.replace(/\[.*?\]/g, '').replace(/\s+/g, ' ').trim();
  answerReveal.style.display = 'block';
  answerReveal.className = result || '';
  answerReveal.innerHTML = `
    <div class="label">${reason === 'done' ? "Time's up — Answer" : 'Answer'}</div>
    <div class="answer-text">${clean}</div>`;
}

/* ═══════════════════════════════════════════════════════════════════
   Skip
═══════════════════════════════════════════════════════════════════ */
function doSkip() {
  if (state.phase === 'idle' || state.phase === 'loading') return;
  state.synth.cancel(); stopElAudio(); stopMic(); clearTimeout(state.readingTimer);
  if (state.phase === 'reading' || state.phase === 'buzzed') {
    if (state.phase === 'buzzed') updateScore('wrong');
    setPhase('done'); hideBuzzUI(); btnBuzz.disabled = true;
    resultBanner.style.display = 'none';
    revealAnswer(null, 'done');
    renderQuestionWords(state.words.length - 1);
    progressBar.style.width = '100%';
  }
}

/* ═══════════════════════════════════════════════════════════════════
   Utility
═══════════════════════════════════════════════════════════════════ */
function hideAll() {
  emptyState.classList.add('hidden');
  qText.classList.add('hidden');
  progressWrap.classList.add('hidden');
  answerReveal.style.display = 'none';
  hideBuzzUI();
  resultBanner.style.display = 'none';
  metaStrip.innerHTML = '';
}

/* ═══════════════════════════════════════════════════════════════════
   Event listeners
═══════════════════════════════════════════════════════════════════ */
btnNew.addEventListener('click', () => {
  state.synth.cancel(); stopElAudio(); stopMic(); clearTimeout(state.readingTimer);
  fetchTossup();
});

btnBuzz.addEventListener('click', doBuzz);
btnSkip.addEventListener('click', doSkip);
btnSubmit.addEventListener('click', () => submitAnswer(answerInput.value));
answerInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitAnswer(answerInput.value); });

speedSlider.addEventListener('input', () => {
  speedLabel.textContent = parseFloat(speedSlider.value).toFixed(2).replace(/\.?0+$/,'') + '×';
  if (state.phase !== 'reading') return;
  // ElevenLabs: just update playback rate live
  if (usingElevenLabs()) {
    if (state.elAudio) state.elAudio.playbackRate = Math.min(Math.max(getRate(), 0.5), 2.0);
    return;
  }
  // Web Speech: rebuild chunks from current word
  const resumeFrom = state.wordIdx;
  state.synth.cancel(); clearTimeout(state.readingTimer);
  const offset = resumeFrom >= 0 ? resumeFrom : 0;
  const partialChunks = buildChunks(state.words.slice(offset));
  ttsChunks = partialChunks.map(c => ({
    ...c,
    words:    c.words.map(w => ({ ...w, idx: w.idx + offset })),
    startIdx: c.startIdx + offset,
    endIdx:   c.endIdx   + offset,
  }));
  chunkIdx = 0;
  state.readingTimer = setTimeout(() => speakChunk(0), 100);
});

document.addEventListener('visibilitychange', () => {
  if (state.phase !== 'reading') return;
  if (document.hidden) {
    if (usingElevenLabs()) state.elAudio?.pause();
    else state.synth.pause();
  } else {
    if (usingElevenLabs()) state.elAudio?.play();
    else state.synth.resume();
  }
});

// iOS: keep Web Speech alive
setInterval(() => {
  if (state.synth.speaking && state.phase === 'reading' && !usingElevenLabs())
    state.synth.resume();
}, 10000);
