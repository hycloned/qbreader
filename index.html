<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QBReader Mobile</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
<div id="app">

  <header>
    <h1>⚡ QBReader</h1>
    <div class="header-right">
      <div id="score-display">
        <span id="score-correct">0</span>/<span id="score-total">0</span>
        &nbsp;·&nbsp;<span id="score-pct">—</span>
      </div>
      <button id="btn-settings" title="Settings">⚙️</button>
    </div>
  </header>

  <!-- Settings drawer -->
  <div id="settings-drawer">
    <div class="drawer-inner">
      <div class="setting-group">
        <label>Voice</label>
        <select id="sel-voice"><option value="">Loading…</option></select>
      </div>
      <div class="setting-group">
        <label>Speed — <span id="speed-label">0.9×</span></label>
        <input type="range" id="speed-slider" min="0.5" max="2.0" step="0.05" value="0.9" />
      </div>
      <div class="setting-group">
        <label>When you buzz</label>
        <select id="sel-answer-mode">
          <option value="voice-then-type">Speak answer (mic)</option>
          <option value="type-only">Type answer only</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div id="filters-row">
    <div class="setting-group">
      <label>Category</label>
      <select id="sel-category">
        <option value="">All Categories</option>
        <option value="Literature">Literature</option>
        <option value="History">History</option>
        <option value="Science">Science</option>
        <option value="Fine Arts">Fine Arts</option>
        <option value="Religion">Religion</option>
        <option value="Mythology">Mythology</option>
        <option value="Philosophy">Philosophy</option>
        <option value="Social Science">Social Science</option>
        <option value="Current Events">Current Events</option>
        <option value="Geography">Geography</option>
        <option value="Other Academic">Other Academic</option>
        <option value="Trash">Trash</option>
      </select>
    </div>
    <div class="setting-group">
      <label>Difficulty</label>
      <select id="sel-difficulty">
        <option value="">All Levels</option>
        <option value="1">1 — Middle School</option>
        <option value="2">2</option>
        <option value="3">3 — Easy HS</option>
        <option value="4">4</option>
        <option value="5">5 — Regular HS</option>
        <option value="6">6 — Hard HS</option>
        <option value="7">7 — Easy College</option>
        <option value="8">8 — Regular College</option>
        <option value="9">9 — Hard College</option>
        <option value="10">10 — Open</option>
      </select>
    </div>
  </div>

  <!-- Topic (subcategory) & year range -->
  <div id="filters-row-2">
    <div class="setting-group">
      <label>Topic</label>
      <select id="sel-subcategory" disabled>
        <option value="">All Topics</option>
      </select>
    </div>
    <div class="setting-group">
      <label>Year from</label>
      <select id="sel-year-from">
        <option value="">Any</option>
      </select>
    </div>
    <div class="setting-group">
      <label>Year to</label>
      <select id="sel-year-to">
        <option value="">Any</option>
      </select>
    </div>
  </div>

  <div id="meta-strip"></div>

  <div id="question-card">
    <div id="empty-state">
      <div class="icon">📖</div>
      <p>Tap <strong>New Question</strong> to start</p>
    </div>
    <div id="question-text" class="hidden"></div>
    <div id="progress-bar-wrap" class="hidden"><div id="progress-bar"></div></div>
    <div id="answer-reveal"></div>
  </div>

  <div id="buzz-section">
    <button id="btn-buzz" disabled>BUZZ</button>
    <div id="answer-input-row">
      <div id="mic-status">
        <span class="mic-icon">🎙️</span>
        <div>
          <div>Listening… speak your answer</div>
          <div id="mic-transcript"></div>
        </div>
      </div>
      <button id="btn-cancel-mic">Cancel / type instead</button>
      <div id="fallback-row">
        <input id="answer-input" type="text" placeholder="Your answer…"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <button id="btn-submit">Submit</button>
      </div>
    </div>
    <div id="result-banner"></div>
  </div>

  <div id="action-row">
    <button class="action-btn" id="btn-skip">Skip / Reveal</button>
    <button class="action-btn primary" id="btn-new">New Question</button>
  </div>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
